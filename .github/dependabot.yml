version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Project rule: only adopt package versions that are at least 7 days old.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Framework/platform majors need a manual, planned upgrade.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opennextjs/cloudflare"
        update-types: ["version-update:semver-major"]
      - dependency-name: wrangler
        update-types: ["version-update:semver-major"]
      - dependency-name: better-auth
        update-types: ["version-update:semver-major"]
      - dependency-name: drizzle-orm
        update-types: ["version-update:semver-major"]
      # Toolchain majors gated on the Next lint stack (see PROJECT-STATUS.md):
      # TS 7 breaks typescript-eslint (#52); ESLint 10 isn't supported by the
      # plugins eslint-config-next pulls in (#51).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
