name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Clearly fake, CI-only values. Auth fails closed without a secret, and
      # everything below runs against local Miniflare D1/R2 — no real services.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # next build prerenders /guides and /field-notes from the database.
      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Clearly fake, CI-only values (the admin pair is the .env.example local
      # dev seed, not a secret). Everything runs against local Miniflare D1/R2
      # and the fake editorial provider — no real services are contacted.
      CI: "true"
      E2E_PORT: "3000"
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_INITIAL_EMAIL: admin@decodedhiring.local
      ADMIN_INITIAL_PASSWORD: admin-local-dev-password-2026!
      ADMIN_INITIAL_NAME: Ahmed Awad
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npm run test:e2e:ci

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  worker-size:
    name: Worker size budget
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same clearly fake, CI-only values as `verify`; local Miniflare only.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
      # Workers Free/Paid limit is 64 MiB uncompressed; notice growth at 20 MiB.
      WORKER_UNCOMPRESSED_BUDGET_KIB: "20480"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Build Worker (OpenNext)
        run: npm run cf:build

      - name: Check Worker uncompressed size
        run: npm run cf:size
