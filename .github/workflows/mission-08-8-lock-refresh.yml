name: Mission 08.8 Lockfile Refresh

on:
  push:
    branches:
      - mission-08.8-observability-final-certification

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check target version
        id: target
        shell: bash
        run: |
          if grep -q '"next": "16.3.6"' package.json && grep -q '"eslint-config-next": "16.3.6"' package.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node 22
        if: steps.target.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile only
        if: steps.target.outputs.ready == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        if: steps.target.outputs.ready == 'true'
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mission 08.8: refresh lockfile for Next 16.3.6"
          git push origin HEAD:mission-08.8-observability-final-certification
