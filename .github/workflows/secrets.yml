name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The MIT-licensed standalone CLI needs no GITLEAKS_LICENSE or GitHub
      # token. No action wrapper, repository secrets, or remote uploads.
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$install_dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | (cd "$install_dir" && sha256sum --check --strict)
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan all fetched history and tracked files
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --log-opts=--all --redact
          tracked_dir="$RUNNER_TEMP/gitleaks-tracked"
          mkdir -p "$tracked_dir"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$tracked_dir"
          gitleaks dir "$tracked_dir" --redact
