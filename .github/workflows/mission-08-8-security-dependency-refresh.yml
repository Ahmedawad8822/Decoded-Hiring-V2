name: Mission 08.8 Security Dependency Refresh

on:
  push:
    branches:
      - mission-08.8-observability-final-certification

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Mission 08.8: stage Next 16.3.8 security refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate exact security patch lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Commit generated package state and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mission-08-8-security-dependency-refresh.yml
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "Mission 08.8: upgrade Next security baseline to 16.3.8"
          git push origin HEAD:mission-08.8-observability-final-certification
