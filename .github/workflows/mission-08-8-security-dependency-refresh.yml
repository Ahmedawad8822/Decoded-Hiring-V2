name: Mission 08.8 Security Dependency Artifact

on:
  push:
    branches:
      - mission-08.8-observability-final-certification

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact Next 16.3.8 package state
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8 eslint-config-next@16.3.8
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.3.8'||p.devDependencies['eslint-config-next']!=='16.3.8') process.exit(1)"
          git diff -- package.json package-lock.json > next-16.3.8.patch
      - name: Upload generated package state
        uses: actions/upload-artifact@v4
        with:
          name: next-16.3.8-package-state
          path: |
            package.json
            package-lock.json
            next-16.3.8.patch
          if-no-files-found: error
          retention-days: 1
