name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # weekly: catch new advisories on an unchanged tree

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Fails on high/critical advisories in production dependencies only.
      # Known dev-tooling moderates (see Docs/Engineering/DEPENDENCY-AUDIT.md)
      # are below the threshold and do not fail the job.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
